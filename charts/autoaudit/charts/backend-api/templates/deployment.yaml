apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-api
  namespace: production
spec:
  selector:
    matchLabels:
      app: backend-api
  template:
    metadata:
      labels:
        app: backend-api
    spec:
      serviceAccountName: autoaudit
      volumes:
        - name: cloudsql-socket
          emptyDir: {}
      containers:
        - name: backend-api
          image: "{{ .Values.global.imageRegistry }}/backend-api:{{ .Values.global.imageTag }}"
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          ports:
            - containerPort: 8000
          envFrom:
            - secretRef:
                name: autoaudit-app-secrets
          volumeMounts:
            - name: cloudsql-socket
              mountPath: /cloudsql
          resources:
            requests:
              cpu: {{ .Values.resources.requests.cpu }}
              memory: {{ .Values.resources.requests.memory }}
            limits:
              cpu: {{ .Values.resources.limits.cpu }}
              memory: {{ .Values.resources.limits.memory }}
        - name: cloud-sql-proxy
          image: gcr.io/cloud-sql-connectors/cloud-sql-proxy:2
          args:
            - "--structured-logs"
            - "{{ .Values.global.cloudSqlInstance }}"
          volumeMounts:
            - name: cloudsql-socket
              mountPath: /cloudsql
          securityContext:
            runAsNonRoot: true
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
