{{- if .Values.backendApi.autoscaling.enabled }}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "autoaudit.fullname" . }}-backend-api
  labels:
    {{- include "autoaudit.componentLabels" (dict "context" . "component" "backend-api") | nindent 4 }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "autoaudit.fullname" . }}-backend-api
  minReplicas: {{ .Values.backendApi.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.backendApi.autoscaling.maxReplicas }}
  metrics:
    {{- with .Values.backendApi.autoscaling.targetCPUUtilizationPercentage }}
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ . }}
    {{- end }}
    {{- with .Values.backendApi.autoscaling.targetMemoryUtilizationPercentage }}
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: {{ . }}
    {{- end }}
  {{- with .Values.backendApi.autoscaling.behavior }}
  behavior:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
