apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: autoaudit-secrets
  namespace: production
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: gcp-secret-store
    kind: ClusterSecretStore
  target:
    name: autoaudit-app-secrets
  data:
    - secretKey: DATABASE_URL
      remoteRef:
        key: DATABASE_URL
    - secretKey: REDIS_URL
      remoteRef:
        key: REDIS_URL
    - secretKey: ENCRYPTION_KEY
      remoteRef:
        key: ENCRYPTION_KEY
    - secretKey: JWT_SECRET
      remoteRef:
        key: JWT_SECRET
