name: 'PR Status Comment'
description: 'Creates or updates a marker-tagged comment on a PR'
inputs:
  marker:
    description: 'Unique HTML comment marker identifying this comment'
    required: true
  body:
    description: 'Full markdown body to post (should include the marker)'
    required: true
  issue-number:
    description: 'PR/issue number to comment on (defaults to context.issue.number)'
    required: false
    default: ''
runs:
  using: 'composite'
  steps:
    - uses: actions/github-script@v7
      env:
        PR_STATUS_MARKER: ${{ inputs.marker }}
        PR_STATUS_BODY: ${{ inputs.body }}
        PR_STATUS_ISSUE_NUMBER: ${{ inputs.issue-number }}
      with:
        script: |
          const marker = process.env.PR_STATUS_MARKER;
          const body = process.env.PR_STATUS_BODY;
          const issueNumber = process.env.PR_STATUS_ISSUE_NUMBER
            ? parseInt(process.env.PR_STATUS_ISSUE_NUMBER, 10)
            : context.issue.number;

          try {
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
            });

            const existing = comments.find(c =>
              c.user.login === 'github-actions[bot]' && c.body.includes(marker)
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                body,
              });
            }
          } catch (err) {
            core.warning(`Could not post PR status comment: ${err.message || err}`);
          }
