name: 'PR Status Comment'
description: 'Creates or updates a marker-tagged comment on a PR'
inputs:
  marker:
    description: 'Unique HTML comment marker identifying this comment'
    required: true
  body:
    description: 'Full markdown body to post (should include the marker)'
    required: true
runs:
  using: 'composite'
  steps:
    - uses: actions/github-script@v7
      with:
        script: |
          const marker = `${{ inputs.marker }}`;
          const body = `${{ inputs.body }}`;

          try {
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const existing = comments.find(c =>
              c.user.login === 'github-actions[bot]' && c.body.includes(marker)
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
          } catch (err) {
            core.warning(`Could not post PR status comment: ${err.message || err}`);
          }
