name: "Security CI/CD"

# The security/ module holds the TPRM Scanner from T2 2025 and is no longer actively maintained.
# This workflow is kept so any accidental changes to security/ are still scanned,
# but it is not expected to run under normal development.

on:
  push:
    branches: [main]
    paths:
      - 'security/**'
  pull_request:
    branches: [main]
    paths:
      - 'security/**'
  schedule:
    - cron: '32 23 * * 6'

permissions:
  contents: read

jobs:
  analyze:
    name: Security Analysis on (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        language: ['python']
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@6f5948dfacef28e207b48d0905cf90c03365536d # v3
        with:
          languages: ${{ matrix.language }}

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@6f5948dfacef28e207b48d0905cf90c03365536d # v3
        with:
          category: "/language:${{matrix.language}}"

  run-lint:
    name: Linting Code
    runs-on: ubuntu-latest
    permissions:
      contents: read
      statuses: write
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Lint Code Base
        uses: github/super-linter@454ba4482ce2cd0c505bc592e83c06e1e37ade61 # v4
        env:
          VALIDATE_ALL_CODEBASE: false
          DEFAULT_BRANCH: "main"
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Align with Backend CI: pytest suites are covered by pytest, not style/copy-paste gates.
          FILTER_REGEX_EXCLUDE: .*backend-api/tests/.*
          VALIDATE_YAML: false
          VALIDATE_GITHUB_ACTIONS: false
          VALIDATE_PYTHON_BLACK: false
          VALIDATE_PYTHON_FLAKE8: false
          VALIDATE_PYTHON_ISORT: false
          VALIDATE_JAVASCRIPT_STANDARD: false
          VALIDATE_HTML: false
          VALIDATE_MARKDOWN: false
          VALIDATE_NATURAL_LANGUAGE: false

  report:
    name: Report PR status
    needs: [analyze, run-lint]
    if: always() && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      issues: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Build report body
        id: build
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            // Fork PRs get a read-only GITHUB_TOKEN; commenting on the upstream PR is forbidden.
            const headRepo = context.payload.pull_request?.head?.repo?.full_name;
            const baseRepo = `${context.repo.owner}/${context.repo.repo}`;
            if (headRepo && headRepo !== baseRepo) {
              core.info(`Skipping PR comment for fork PR (${headRepo} → ${baseRepo}).`);
              return;
            }

            const analyze = '${{ needs.analyze.result }}';
            const lint    = '${{ needs.run-lint.result }}';

            const icon = r => ({ success: '✅', failure: '❌', cancelled: '🚫', skipped: '⏭️' }[r] ?? '❓');
            const allPassed = [analyze, lint].every(r => ['success', 'skipped'].includes(r));
            const runUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;

            const body = [
              '<!-- ci-report-security -->',
              `### CI: Security`,
              ``,
              `| Job | Result |`,
              `|---|---|`,
              `| Security analysis (CodeQL) | ${icon(analyze)} \`${analyze}\` |`,
              `| Lint | ${icon(lint)} \`${lint}\` |`,
              ``,
              allPassed
                ? `All checks passed.`
                : `One or more checks failed. [View logs](${runUrl})`,
            ].join('\n');

            core.setOutput('body', body);

      - if: steps.build.outputs.body
        uses: ./.github/actions/pr-status-comment
        with:
          marker: '<!-- ci-report-security -->'
          body: ${{ steps.build.outputs.body }}
