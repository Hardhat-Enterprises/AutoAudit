name: "Repository Gates"

# tools/tests holds gates that read the source tree rather than import it: they
# assert something about the repository that no component's own test suite is
# positioned to see. They are deliberately not path-filtered -- each one reads
# across component boundaries, and a filter that has to enumerate every
# directory a gate touches is a filter that will be wrong the first time a gate
# grows.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  gates:
    name: Repository gates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install pytest
        # The gates read files with pathlib, re and ast. pytest is the only
        # dependency any of them has.
        run: python -m pip install --upgrade pip pytest

      - name: Product claims match what the product does
        run: python -m pytest tools/tests/test_product_claims.py -q
