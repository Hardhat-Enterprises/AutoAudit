name: Backfill All PR Labels (existing open PRs)

# Manual only — run this once after installing the system, and again any
# time you want to force a re-check on all currently-open PRs. Covers
# everything: area, size, multi, first-contribution, AND the
# needs-triage/stale/needs-decision/final-notice activity labels.
on:
  workflow_dispatch: {}

permissions:
  pull-requests: write
  issues: write # labels/labels-list live under the Issues API even for PRs
  contents: read

jobs:
  list-open-prs:
    runs-on: ubuntu-latest
    outputs:
      json: ${{ steps.list.outputs.json }} # e.g. [3,2,1] — for embedding into JS array literals
      lines: ${{ steps.list.outputs.lines }} # e.g. "3\n2\n1" with REAL newlines — for actions/labeler's pr-number input
    steps:
      - id: list
        uses: actions/github-script@v9
        with:
          script: |
            const prs = await github.paginate(github.rest.pulls.list, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              per_page: 100,
            });
            const numbers = prs.map((p) => p.number);
            // core.setOutput writes real newline characters correctly via
            // the GITHUB_OUTPUT heredoc format — a YAML/expression '\n'
            // string literal does NOT produce a real newline, which is
            // what caused the "not a valid pull request number" warning.
            core.setOutput("json", JSON.stringify(numbers));
            core.setOutput("lines", numbers.join("\n"));

  area-labels-backfill:
    needs: list-open-prs
    if: needs.list-open-prs.outputs.json != '[]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/labeler@v7
        with:
          configuration-path: .github/labeler.yml
          pr-number: ${{ needs.list-open-prs.outputs.lines }}
          sync-labels: true

  metadata-labels-backfill:
    needs: [list-open-prs, area-labels-backfill]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/github-script@v9
        with:
          script: |
            const { labelOne } = require('${{ github.workspace }}/.github/scripts/pr-metadata-labeler.js');
            const { owner, repo } = context.repo;
            const prNumbers = ${{ needs.list-open-prs.outputs.json }};

            for (const pr_number of prNumbers) {
              const { data: pr } = await github.rest.pulls.get({ owner, repo, pull_number: pr_number });
              await labelOne({ github, owner, repo, pr });
            }

  activity-labels-backfill:
    needs: metadata-labels-backfill
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/github-script@v9
        with:
          script: |
            const run = require('${{ github.workspace }}/.github/scripts/activity-labeler.js');
            await run({ github, context, core });
