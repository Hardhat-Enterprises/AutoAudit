name: Detect Secrets Baseline Check

on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main, staging]

permissions:
  contents: read

jobs:
  detect-secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'

      - name: Install detect-secrets
        run: pip install detect-secrets==1.5.0

      # `detect-secrets scan --baseline` rewrites .secrets.baseline in place,
      # carrying forward existing audit annotations (is_secret) for findings
      # that already exist there (matched by file+line+hash), and leaving new
      # findings without an is_secret key. So a rescan followed by checking
      # for missing/true is_secret is how detect-secrets-hook implements the
      # same check locally in the pre-commit hook -- this just runs it in CI
      # too, so drift can't slip through if someone skips the hook.
      - name: Check baseline for unaudited or confirmed secrets
        run: |
          if [ ! -f .secrets.baseline ]; then
            echo "::error::.secrets.baseline is missing from the repository root."
            exit 1
          fi

          detect-secrets scan --baseline .secrets.baseline

          python3 - <<'PY'
          import json
          import sys

          with open(".secrets.baseline") as f:
              data = json.load(f)

          unaudited = []
          confirmed = []
          for filename, findings in data.get("results", {}).items():
              for finding in findings:
                  if "is_secret" not in finding:
                      unaudited.append((filename, finding.get("line_number"), finding.get("type")))
                  elif finding["is_secret"] is True:
                      confirmed.append((filename, finding.get("line_number"), finding.get("type")))

          if confirmed:
              print("::error::Confirmed secret(s) found in the codebase:")
              for filename, line, type_ in confirmed:
                  print(f"::error::  {filename}:{line} ({type_})")

          if unaudited:
              print("::error::Found candidate secret(s) not yet audited in .secrets.baseline:")
              for filename, line, type_ in unaudited:
                  print(f"::error::  {filename}:{line} ({type_})")

          if confirmed or unaudited:
              print(
                  "\nRun 'detect-secrets scan --baseline .secrets.baseline' and "
                  "'detect-secrets audit .secrets.baseline' locally, resolve each "
                  "finding, then commit the updated baseline."
              )
              sys.exit(1)

          print("No unaudited or confirmed secrets found -- baseline is current.")
          PY
