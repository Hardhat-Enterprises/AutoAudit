name: "Backend + API CI/CD"

on:
  push:
    branches: [main]
    paths:
      - 'backend-api/**'
  pull_request:
    branches: [main]
    paths:
      - 'backend-api/**'
  schedule:
    - cron: '32 23 * * 6'

permissions:
  contents: read

jobs:
  analyze:
    name: Security Analysis on (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        language: ['python']
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'

      - name: Initialize CodeQL
        uses: github/codeql-action/init@6f5948dfacef28e207b48d0905cf90c03365536d # v3
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      - if: matrix.build-mode == 'manual'
        shell: bash
        run: |
          echo 'If you are using a "manual" build mode for one or more of the' \
            'languages you are analyzing, replace this with the commands to build' \
            'your code, for example:'
          echo '  make bootstrap'
          echo '  make release'
          exit 1

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@6f5948dfacef28e207b48d0905cf90c03365536d # v3
        with:
          category: "/language:${{matrix.language}}"

      - name: Install Bandit
        run: pip install bandit

      - name: Run Bandit scan on backend-api
        # Exclude pytest suites (B101 assert_used) and local venvs.
        # backend-api/.bandit also sets exclude=tests,.venv,venv for local runs.
        run: bandit -r backend-api -x backend-api/tests,backend-api/.venv,backend-api/venv -f txt

  run-lint:
    name: Linting Code
    runs-on: ubuntu-latest
    permissions:
      contents: read
      statuses: write
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Lint Code Base
        uses: github/super-linter@v7
        env:
          VALIDATE_ALL_CODEBASE: false
          DEFAULT_BRANCH: "main"
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Pytest suites are covered by pytest; exclude from style/secret/copy-paste gates.
          FILTER_REGEX_EXCLUDE: .*backend-api/tests/.*
          VALIDATE_YAML: false
          VALIDATE_GITHUB_ACTIONS: false
          VALIDATE_PYTHON_BLACK: false
          VALIDATE_PYTHON_FLAKE8: false
          VALIDATE_PYTHON_ISORT: false
          VALIDATE_JAVASCRIPT_STANDARD: false
          VALIDATE_TYPESCRIPT_STANDARD: false
          VALIDATE_HTML: false
          VALIDATE_MARKDOWN: false
          VALIDATE_MARKDOWN_PRETTIER: false
          VALIDATE_NATURAL_LANGUAGE: false
          VALIDATE_PYTHON_PYLINT: false
          VALIDATE_PYTHON_RUFF: false
          VALIDATE_PYTHON_PYINK: false
          VALIDATE_JSCPD: false
          VALIDATE_CHECKOV: false
          VALIDATE_YAML_PRETTIER: false

  backend-tests:
    name: Integration Tests (pytest)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: autoaudit
          POSTGRES_PASSWORD: autoaudit_dev_password
          POSTGRES_DB: autoaudit_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies (Tesseract for evidence OCR)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends tesseract-ocr libtesseract-dev

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Install dependencies
        working-directory: backend-api
        run: uv sync --frozen --extra evidence

      - name: Run integration test suite
        working-directory: backend-api
        # DATABASE_URL etc. are intentionally left unset here: tests/conftest.py
        # sets matching defaults (os.environ.setdefault) that point at this same
        # postgres service (db autoaudit_test, user/password autoaudit), and
        # runs `alembic upgrade head` itself before any test executes -- so a
        # separate migration step isn't needed, this just has to be the same
        # entrypoint a developer runs locally.
        run: uv run pytest -v

  test:
    name: Pytest
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: autoaudit
          POSTGRES_PASSWORD: autoaudit_dev_password
          POSTGRES_DB: autoaudit_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies (Tesseract for evidence OCR)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends tesseract-ocr libtesseract-dev

      - name: Set up uv
        uses: astral-sh/setup-uv@v4

      - name: Install and run pytest
        working-directory: backend-api
        # DATABASE_URL etc. are intentionally left unset here: tests/conftest.py
        # sets matching defaults (os.environ.setdefault) that point at this same
        # postgres service, and runs `alembic upgrade head` itself before any
        # test executes (see backend-tests job above for the same setup).
        run: |
          uv sync --group dev --extra evidence
          uv run pytest tests/ -q

  coverage:
    name: Pytest coverage
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: autoaudit
          POSTGRES_PASSWORD: autoaudit_dev_password
          POSTGRES_DB: autoaudit_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies (Tesseract for evidence OCR)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends tesseract-ocr libtesseract-dev

      - name: Set up uv
        uses: astral-sh/setup-uv@v4

      - name: Install and run coverage
        working-directory: backend-api
        # DATABASE_URL etc. are intentionally left unset here: tests/conftest.py
        # sets matching defaults (os.environ.setdefault) that point at this same
        # postgres service, and runs `alembic upgrade head` itself before any
        # test executes (see the test job above for the same setup).
        run: |
          uv sync --group dev --extra evidence
          uv run pytest tests/ \
            --cov=app \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml \
            --cov-report=html:htmlcov
          # fail_under is configured in pyproject.toml ([tool.coverage.report])

      - name: Upload coverage HTML
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-api-coverage-html
          path: backend-api/htmlcov/
          if-no-files-found: warn

      - name: Upload coverage XML
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-api-coverage-xml
          path: backend-api/coverage.xml
          if-no-files-found: warn

  report:
    name: Report PR status

    needs: [analyze, run-lint, backend-tests, test, coverage]
    if: always() && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      issues: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Build report body
        id: build
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            // Fork PRs get a read-only GITHUB_TOKEN; commenting on the upstream PR is forbidden.
            const headRepo = context.payload.pull_request?.head?.repo?.full_name;
            const baseRepo = `${context.repo.owner}/${context.repo.repo}`;
            if (headRepo && headRepo !== baseRepo) {
              core.info(`Skipping PR comment for fork PR (${headRepo} → ${baseRepo}).`);
              return;
            }

            const analyze = '${{ needs.analyze.result }}';
            const lint    = '${{ needs.run-lint.result }}';
            const integration = '${{ needs.backend-tests.result }}';
            const test    = '${{ needs.test.result }}';
            const coverage = '${{ needs.coverage.result }}';

            const icon = r => ({ success: '✅', failure: '❌', cancelled: '🚫', skipped: '⏭️' }[r] ?? '❓');
            const allPassed = [analyze, lint, integration, test, coverage].every(r => ['success', 'skipped'].includes(r));
            const runUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;

            const body = [
              '<!-- ci-report-backend-api -->',
              `### CI: Backend API`,
              ``,
              `| Job | Result |`,
              `|---|---|`,
              `| Security analysis (CodeQL + Bandit) | ${icon(analyze)} \`${analyze}\` |`,
              `| Lint | ${icon(lint)} \`${lint}\` |`,
              `| Integration tests (pytest) | ${icon(integration)} \`${integration}\` |`,
              `| Pytest | ${icon(test)} \`${test}\` |`,
              `| Pytest coverage | ${icon(coverage)} \`${coverage}\` |`,
              ``,
              allPassed
                ? `All checks passed.`
                : `One or more checks failed. [View logs](${runUrl})`,
            ].join('\n');

            core.setOutput('body', body);

      - if: steps.build.outputs.body
        uses: ./.github/actions/pr-status-comment
        with:
          marker: '<!-- ci-report-backend-api -->'
          body: ${{ steps.build.outputs.body }}