name: "Backend + API CI/CD"

on:
  push:
    branches: [main]
    paths:
      - 'backend-api/**'
  pull_request:
    branches: [main]
    paths:
      - 'backend-api/**'
  schedule:
    - cron: '32 23 * * 6'

jobs:
  analyze:
    name: Security Analysis on (${{ matrix.language }})
    runs-on: ${{ (matrix.language == 'swift' && 'macos-latest') || 'ubuntu-latest' }}
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        language: ['python']
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      - if: matrix.build-mode == 'manual'
        shell: bash
        run: |
          echo 'If you are using a "manual" build mode for one or more of the' \
            'languages you are analyzing, replace this with the commands to build' \
            'your code, for example:'
          echo '  make bootstrap'
          echo '  make release'
          exit 1

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{matrix.language}}"

      - name: Install Bandit
        run: pip install bandit

      - name: Run Bandit scan on backend-api
        # Exclude pytest suites (B101 assert_used) and local venvs.
        # backend-api/.bandit also sets exclude=tests,.venv,venv for local runs.
        run: bandit -r backend-api -x backend-api/tests,backend-api/.venv,backend-api/venv -f txt

  run-lint:
    name: Linting Code
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Lint Code Base
        uses: github/super-linter@v4
        env:
          VALIDATE_ALL_CODEBASE: false
          DEFAULT_BRANCH: "main"
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Pytest suites are covered by pytest; exclude from style/secret/copy-paste gates.
          FILTER_REGEX_EXCLUDE: .*backend-api/tests/.*
          VALIDATE_YAML: false
          VALIDATE_GITHUB_ACTIONS: false
          VALIDATE_PYTHON_BLACK: false
          VALIDATE_PYTHON_FLAKE8: false
          VALIDATE_PYTHON_ISORT: false
          VALIDATE_JAVASCRIPT_STANDARD: false
          VALIDATE_HTML: false
          VALIDATE_MARKDOWN: false
          VALIDATE_MARKDOWN_PRETTIER: false
          VALIDATE_NATURAL_LANGUAGE: false

  test:
    name: Pytest
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v4

      - name: Install and run pytest
        working-directory: backend-api
        run: |
          uv sync --extra dev
          uv run pytest tests/ -q

  report:
    name: Report PR status
    needs: [analyze, run-lint, test]
    if: always() && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      issues: write
    steps:
      - name: Build report body
        id: build
        uses: actions/github-script@v7
        with:
          script: |
            // Fork PRs get a read-only GITHUB_TOKEN; commenting on the upstream PR is forbidden.
            const headRepo = context.payload.pull_request?.head?.repo?.full_name;
            const baseRepo = `${context.repo.owner}/${context.repo.repo}`;
            if (headRepo && headRepo !== baseRepo) {
              core.info(`Skipping PR comment for fork PR (${headRepo} → ${baseRepo}).`);
              return;
            }

            const analyze = '${{ needs.analyze.result }}';
            const lint    = '${{ needs.run-lint.result }}';
            const test    = '${{ needs.test.result }}';

            const icon = r => ({ success: '✅', failure: '❌', cancelled: '🚫', skipped: '⏭️' }[r] ?? '❓');
            const allPassed = [analyze, lint, test].every(r => ['success', 'skipped'].includes(r));
            const runUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;

            const body = [
              '<!-- ci-report-backend-api -->',
              `### CI: Backend API`,
              ``,
              `| Job | Result |`,
              `|---|---|`,
              `| Security analysis (CodeQL + Bandit) | ${icon(analyze)} \`${analyze}\` |`,
              `| Lint | ${icon(lint)} \`${lint}\` |`,
              `| Pytest | ${icon(test)} \`${test}\` |`,
              ``,
              allPassed
                ? `All checks passed.`
                : `One or more checks failed. [View logs](${runUrl})`,
            ].join('\n');

            core.setOutput('body', body);

      - if: steps.build.outputs.body
        uses: ./.github/actions/pr-status-comment
        with:
          marker: '<!-- ci-report-backend-api -->'
          body: ${{ steps.build.outputs.body }}
