[mypy]
# Files across backend-api/ and its tests import each other as "app.*" /
# "tests.*" (e.g. tests/conftest.py does `from app.main import app`), but
# backend-api/app has no __init__.py, so plain mypy can't decide whether a
# file like backend-api/app/main.py should be identified as module "main"
# or "app.main". When super-linter passes several changed files to mypy in
# one invocation, that ambiguity surfaces as:
#   error: Source file found twice under different module names
# explicit_package_bases + mypy_path pins module identity relative to
# backend-api, so it is always resolved consistently as "app.main".
mypy_path = backend-api
explicit_package_bases = True
ignore_missing_imports = True
