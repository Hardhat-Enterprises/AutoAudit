[project]
name = "backend-api"
version = "0.1.0"
description = "AutoAudit API"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.136.1",
    "pydantic>=2.11.7",
    "pydantic-settings>=2.10.1",
    "python-dotenv>=1.1.1",
    "uvicorn>=0.47.0",
    "fastapi-users[sqlalchemy]>=13.0.0",
    "sqlalchemy>=2.0.0",
    "asyncpg>=0.29.0",
    "alembic>=1.13.0",
    # OAuth helpers (Google SSO)
    "httpx>=0.27.0",
    "httpx-oauth>=0.15.0",
    # Microsoft Graph (client credentials via MSAL)
    "msal>=1.31.0",
    # Multipart upload support for evidence/file endpoints
    "python-multipart>=0.0.29",
    # Encryption for credentials at rest
    "cryptography>=42.0.0",
    # Celery client for queueing tasks
    "celery[redis]>=5.3.0",
    "prometheus-fastapi-instrumentator>=8.1.0",
]

[project.optional-dependencies]
# Heavy OCR/reporting stack lives in the "evidence" extra so backend devs
# aren't forced to install it unless they touch evidence scanning.
evidence = [
    "pytesseract>=0.3.10",
    "pillow>=12.2.0",
    "opencv-python>=4.10.0.84",
    "python-docx>=1.1.2",
    "docx2pdf>=0.1.8",
    "pymupdf>=1.24.10",
    "fpdf2>=2.8.1",
    "tabulate>=0.10.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
# Pin async tests and their fixtures to ONE event loop for the whole test
# session. Without this, pytest-asyncio's default "function" loop scope
# creates a brand-new event loop per test, but the SQLAlchemy async
# `engine` (app.db.base.engine) is a session-lifetime singleton whose
# connection pool hands out asyncpg connections across tests. A pooled
# connection created on test N's event loop is not usable from test N+1's
# *different* event loop -- asyncpg raises confusing errors such as
# "cannot perform operation: another operation is in progress" or
# "Event loop is closed" when that happens. Session-scoping the loop
# keeps every test and fixture on the same loop the engine's connections
# were created on.
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
addopts = "-v"